<title>Grid Layout</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

section{
    width:900px;
    height:500px;
    margin:20px auto;
    background:#2f2f63;
    padding:15px;

    display:grid;
    gap:15px;

    grid-template-columns:200px 1fr 1fr 200px;
    grid-template-rows:100px 150px 150px;
     /* grid-template-areas:
        "one two two three"
        "one four five eight"
        "one six seven eight"; */
}

div{
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
    font-weight:bold;
    
}

.div1{
    background:#79c652;

    grid-row: span 3;
   
}


.div2{
    background:#79c652;
    grid-column: span 2;

.div3{
