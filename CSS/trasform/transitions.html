<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            background: linear-gradient(gray,rgba(0, 0, 0, 0.073));
            color: white;
            height: 50px;
            width: 200px;
            margin: 100px;
            transition: background 40s ease-in ;
            
        }
        button:hover{
            background:linear-gradient(rgb(91, 91, 177),rgb(8, 8, 66));
            transform: scaley(1);

        }
    </style>
</head>
<body>
    <button>Hover me</button>
</body>
</html>
