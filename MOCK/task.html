<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            height: 400px;
            width: 400px;
            background-color: antiquewhite;
            display: grid;
            grid-template-columns: repeat(3,auto);
            justify-content: space-around;
            align-content: space-around;
            margin: 100px auto;
            position: absolute;
            /* transition: all  ease; */
        }
    
        div{
            height: 100px;
            width: 100px;
            background-color: aqua;
        }
       
        
        section:hover div{
           position: absolute;
        }
        

        



    </style>
</head>
<body>
    <section>
        <div class="div1"></div>
        <div class="div1"></div>
        <div class="div1"></div>
        <div class="div1"></div>
        <div class="div1"></div>
        <div class="div1"></div>
    </section>
</body>
</html>
